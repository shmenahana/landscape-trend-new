# ============================================================
# .htaccess — SEO Redirect & Indexing Rules for filipropmaint.com
# Drop this into WordPress root (alongside wp-config.php)
# Place ABOVE the # BEGIN WordPress block
# ============================================================

# -------------------------------------------------
# SECTION 1: 404 FIXES — Redirect broken /services/ to correct page
# -------------------------------------------------
# /services/ returns 404 but has internal links pointing to it.
# Redirect to the actual services slug used by the site.
RedirectMatch 301 ^/services/?$ /landscaping-services-canton-ohio/

# Remove junk URLs — return 410 Gone so Google drops them fast
RewriteEngine On
RewriteRule ^lf$ - [G,L]
RewriteRule ^We$ - [G,L]

# -------------------------------------------------
# SECTION 2: BROKEN REDIRECT FIXES
# These pages return broken/looping redirects per GSC.
# Force clean 301s to their correct trailing-slash canonical URLs.
# -------------------------------------------------
RedirectMatch 301 ^/landscaping-north-canton-ohio$ /landscaping-north-canton-ohio/
RedirectMatch 301 ^/lawn-care-canton-ohio$ /lawn-care-canton-ohio/

# -------------------------------------------------
# SECTION 3: REDIRECT AUDIT — Fix all stale/broken redirect chains
# -------------------------------------------------

# Careers page in Lewis Center — likely an old job posting or orphan page.
# Redirect to main careers page.
RedirectMatch 301 ^/landscaping-careers-in-lewis-center-ohio/?$ /landscaping-careers/

# Truncated/broken URL stubs — redirect to parent service pages
RedirectMatch 301 ^/aeration-/?$ /aeration-and-overseeding/
RedirectMatch 301 ^/in-/?$ /

# Service pages without trailing slashes — canonical redirect
RedirectMatch 301 ^/paver-patio-construction$ /paver-patio-construction/
RedirectMatch 301 ^/planting-trees-shrubs-and-bushes$ /planting-trees-shrubs-and-bushes/
RedirectMatch 301 ^/retaining-wall-construction$ /retaining-wall-construction/

# City service pages — ensure trailing slash canonical
RedirectMatch 301 ^/landscaping-louisville-ohio$ /landscaping-louisville-ohio/
RedirectMatch 301 ^/lawn-care-louisville-ohio$ /lawn-care-louisville-ohio/

# /Lawn — capitalized broken stub, redirect to lawn care hub
RedirectMatch 301 ^/Lawn/?$ /lawn-care-canton-ohio/

# Blog posts — canonical trailing slash redirects
RedirectMatch 301 ^/native-blooming-plant-species-of-canton-ohio$ /native-blooming-plant-species-of-canton-ohio/
RedirectMatch 301 ^/landscape-drainage-contractor-ohio$ /landscape-drainage-contractor-ohio/
RedirectMatch 301 ^/essential-yard-drainage-solutions-in-canton-ohio$ /essential-yard-drainage-solutions-in-canton-ohio/
RedirectMatch 301 ^/how-much-does-it-cost-to-mulch-your-flower-beds-in-canton-ohio$ /how-much-does-it-cost-to-mulch-your-flower-beds-in-canton-ohio/

# -------------------------------------------------
# SECTION 4: DUPLICATE / JUNK PAGE CLEANUP
# -------------------------------------------------

# /landscaping-careers-copy/ — draft copy left published. Redirect to real careers page.
RedirectMatch 301 ^/landscaping-careers-copy/?$ /landscaping-careers/

# /lawn-care-akron-ohio-2/ — duplicate. Redirect to canonical version.
RedirectMatch 301 ^/lawn-care-akron-ohio-2/?$ /lawn-care-akron-ohio/

# /the-ultimate-lawn-care-guide-for-beginners-2/ — duplicate blog post.
RedirectMatch 301 ^/the-ultimate-lawn-care-guide-for-beginners-2/?$ /the-ultimate-lawn-care-guide-for-beginners/

# /landing-page/ — generic page. 301 to homepage (or delete in WP and let this catch strays).
RedirectMatch 301 ^/landing-page/?$ /

# ============================================================
# END SEO REDIRECTS — WordPress rules should follow below
# ============================================================
